<svg xmlns="http://www.w3.org/2000/svg" width="800" height="801" viewBox="0 0 800 801" role="img" aria-label="반월상연골 봉합 재활 · 유지/변경"><rect width="800" height="100%" fill="#fff"/><g fill="#244451" font-family="Noto Sans KR,Arial,sans-serif"><text x="28" y="57" font-size="32" font-weight="700">반월상연골 봉합 재활 · 유지/변경</text><text x="28" y="89" font-size="20">교육용 판단 흐름 · 단일 소견으로 확진하지 않음</text><rect x="28" y="116" width="744" height="119" rx="16" fill="#eaf2f6"/><text x="50" y="155" font-size="27" font-weight="700">통상 회복 가설 유지</text><text x="50" y="194" font-size="23">정해진 체중부하/ROM 단계 안에서 재활</text><rect x="28" y="265" width="744" height="153" rx="16" fill="#eef5ec"/><text x="50" y="304" font-size="27" font-weight="700">치유/부하 허용도 불명</text><text x="50" y="343" font-size="23">수술팀 확인 전 임의 조기 full weight</text><text x="50" y="377" font-size="23">bearing 금지</text><rect x="28" y="448" width="744" height="119" rx="16" fill="#fcf0e9"/><text x="50" y="487" font-size="27" font-weight="700">재손상/관절 문제 가능 ↑</text><text x="50" y="526" font-size="23">수술팀에 조기 연락·평가</text><rect x="28" y="597" width="744" height="119" rx="16" fill="#eaf2f6"/><text x="50" y="636" font-size="27" font-weight="700">감염/VTE 위험 ↑</text><text x="50" y="675" font-size="23">당일 또는 응급 평가</text><text x="28" y="771" font-size="20">다음 방문: 같은 조건의 기능과 안전 소견을 함께 확인</text></g></svg>
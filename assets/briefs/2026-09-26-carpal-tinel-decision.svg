<svg xmlns="http://www.w3.org/2000/svg" width="800" height="835" viewBox="0 0 800 835" role="img" aria-label="수근관증후군 · 유지/변경"><rect width="800" height="100%" fill="#fff"/><g fill="#244451" font-family="Noto Sans KR,Arial,sans-serif"><text x="28" y="57" font-size="32" font-weight="700">수근관증후군 · 유지/변경</text><text x="28" y="89" font-size="20">교육용 판단 흐름 · 단일 소견으로 확진하지 않음</text><rect x="28" y="116" width="744" height="153" rx="16" fill="#eaf2f6"/><text x="50" y="155" font-size="27" font-weight="700">CTS 유지; 단일 음성으로 제외 못 함</text><text x="50" y="194" font-size="23">중립 야간 보조기/활동 조정 고려, 경과와</text><text x="50" y="228" font-size="23">감각/근력 추적</text><rect x="28" y="299" width="744" height="153" rx="16" fill="#eef5ec"/><text x="50" y="338" font-size="27" font-weight="700">CTS ↑, 확진은 아님</text><text x="50" y="377" font-size="23">복합 소견과 임상 가중치로 판단; 필요 시</text><text x="50" y="411" font-size="23">신경전도/US</text><rect x="28" y="482" width="744" height="119" rx="16" fill="#fcf0e9"/><text x="50" y="521" font-size="27" font-weight="700">신경 손상 중요도 ↑</text><text x="50" y="560" font-size="23">협진과 전기진단/영상 필요성 조속 평가</text><rect x="28" y="631" width="744" height="119" rx="16" fill="#eaf2f6"/><text x="50" y="670" font-size="27" font-weight="700">척골/경추/다발신경 감별 ↑</text><text x="50" y="709" font-size="23">분포에 맞는 신경검사·검사 의뢰</text><text x="28" y="805" font-size="20">다음 방문: 같은 조건의 기능과 안전 소견을 함께 확인</text></g></svg>
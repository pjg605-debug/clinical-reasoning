<svg xmlns="http://www.w3.org/2000/svg" width="800" height="835" viewBox="0 0 800 835" role="img" aria-label="유착성 관절낭염 · 유지/변경"><rect width="800" height="100%" fill="#fff"/><g fill="#244451" font-family="Noto Sans KR,Arial,sans-serif"><text x="28" y="57" font-size="32" font-weight="700">유착성 관절낭염 · 유지/변경</text><text x="28" y="89" font-size="20">교육용 판단 흐름 · 단일 소견으로 확진하지 않음</text><rect x="28" y="116" width="744" height="153" rx="16" fill="#eaf2f6"/><text x="50" y="155" font-size="27" font-weight="700">관절낭염 ↑, 유지</text><text x="50" y="194" font-size="23">증상 자극도에 맞는 움직임·저강도 운동; 필요 시</text><text x="50" y="228" font-size="23">X-ray로 OA 등 감별</text><rect x="28" y="299" width="744" height="153" rx="16" fill="#eef5ec"/><text x="50" y="338" font-size="27" font-weight="700">회전근개 손상 ↑</text><text x="50" y="377" font-size="23">파열 평가가 관리에 영향을 주면 US/MRI·정형</text><text x="50" y="411" font-size="23">협진</text><rect x="28" y="482" width="744" height="119" rx="16" fill="#fcf0e9"/><text x="50" y="521" font-size="27" font-weight="700">신경 원인 ↑</text><text x="50" y="560" font-size="23">경추/말초신경 검사, 진행성 결손이면 신속 의뢰</text><rect x="28" y="631" width="744" height="119" rx="16" fill="#eaf2f6"/><text x="50" y="670" font-size="27" font-weight="700">감염 등 위험 ↑</text><text x="50" y="709" font-size="23">일상 재활을 중단하고 당일 의료 평가</text><text x="28" y="805" font-size="20">다음 방문: 같은 조건의 기능과 안전 소견을 함께 확인</text></g></svg>
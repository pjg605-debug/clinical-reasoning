<svg xmlns="http://www.w3.org/2000/svg" width="800" height="767" viewBox="0 0 800 767" role="img" aria-label="고관절 골관절염 · 유지/변경"><rect width="800" height="100%" fill="#fff"/><g fill="#244451" font-family="Noto Sans KR,Arial,sans-serif"><text x="28" y="57" font-size="32" font-weight="700">고관절 골관절염 · 유지/변경</text><text x="28" y="89" font-size="20">교육용 판단 흐름 · 단일 소견으로 확진하지 않음</text><rect x="28" y="116" width="744" height="119" rx="16" fill="#eaf2f6"/><text x="50" y="155" font-size="27" font-weight="700">고관절 OA 유지</text><text x="50" y="194" font-size="23">근력운동과 생활 보행량을 별도로 진행</text><rect x="28" y="265" width="744" height="119" rx="16" fill="#eef5ec"/><text x="50" y="304" font-size="27" font-weight="700">GTPS 가중치 ↑, 공존 가능</text><text x="50" y="343" font-size="23">압박/둔근건 부하 조정</text><rect x="28" y="414" width="744" height="119" rx="16" fill="#fcf0e9"/><text x="50" y="453" font-size="27" font-weight="700">요추/신경 원인 ↑</text><text x="50" y="492" font-size="23">신경 bundle·협진 검토</text><rect x="28" y="563" width="744" height="119" rx="16" fill="#eaf2f6"/><text x="50" y="602" font-size="27" font-weight="700">골절/감염 등 ↑</text><text x="50" y="641" font-size="23">신속 또는 당일 의료 평가</text><text x="28" y="737" font-size="20">다음 방문: 같은 조건의 기능과 안전 소견을 함께 확인</text></g></svg>
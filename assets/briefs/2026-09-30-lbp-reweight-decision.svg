<svg xmlns="http://www.w3.org/2000/svg" width="800" height="767" viewBox="0 0 800 767" role="img" aria-label="요통 재평가 · 유지/변경"><rect width="800" height="100%" fill="#fff"/><g fill="#244451" font-family="Noto Sans KR,Arial,sans-serif"><text x="28" y="57" font-size="32" font-weight="700">요통 재평가 · 유지/변경</text><text x="28" y="89" font-size="20">교육용 판단 흐름 · 단일 소견으로 확진하지 않음</text><rect x="28" y="116" width="744" height="119" rx="16" fill="#eaf2f6"/><text x="50" y="155" font-size="27" font-weight="700">비특이적 요통 유지</text><text x="50" y="194" font-size="23">활동·기능 중심의 단계적 재활</text><rect x="28" y="265" width="744" height="119" rx="16" fill="#eef5ec"/><text x="50" y="304" font-size="27" font-weight="700">신경근 가중치 ↑</text><text x="50" y="343" font-size="23">신경 경과 추적, 결과가 관리 바꾸면 MRI/협진</text><rect x="28" y="414" width="744" height="119" rx="16" fill="#fcf0e9"/><text x="50" y="453" font-size="27" font-weight="700">지속 장애 위험 ↑, 구조 확정 아님</text><text x="50" y="492" font-size="23">설명·점진적 실제 업무 노출·지원</text><rect x="28" y="563" width="744" height="119" rx="16" fill="#eaf2f6"/><text x="50" y="602" font-size="27" font-weight="700">마미 등 긴급 문제 ↑</text><text x="50" y="641" font-size="23">즉시 응급 평가; 침·재활 반복 금지</text><text x="28" y="737" font-size="20">다음 방문: 같은 조건의 기능과 안전 소견을 함께 확인</text></g></svg>
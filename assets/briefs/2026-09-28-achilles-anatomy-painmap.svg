<svg xmlns="http://www.w3.org/2000/svg" width="800" height="920" viewBox="0 0 800 920" role="img" aria-labelledby="t d">
<title id="t">아킬레스건 통증 위치와 감별 지도</title><desc id="d">중간부와 부착부 아킬레스건병증, 파열 의심, 비복신경과 후방 발목 감별을 보여주는 임상 인포그래픽</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f8fbfe"/><stop offset="1" stop-color="#edf5f9"/></linearGradient><style>.tx{font-family:Pretendard,'Noto Sans KR','Apple SD Gothic Neo',sans-serif;fill:#173b67}.h{font-weight:900}.m{font-size:18px}.s{font-size:15px}.l{font-size:28px}.xl{font-size:36px}.card{fill:#fff;stroke:#c8dae6;stroke-width:2}.blue{fill:#eaf4fb}.red{fill:#fdeceb}.amber{fill:#fff4da}.line{stroke:#567d98;stroke-width:3;fill:none;stroke-linecap:round}.skin{fill:#f4c8a7;stroke:#cc9d7e;stroke-width:2}.muscle{fill:#d97562}.tendon{fill:#f3efe2;stroke:#b7aa90;stroke-width:2}.bone{fill:#e7d6b6;stroke:#b8a17c;stroke-width:2}.white{fill:#fff}</style></defs>
<rect width="800" height="920" fill="url(#bg)"/><rect x="22" y="20" width="756" height="88" rx="18" fill="#173f72"/><text x="48" y="60" class="tx h xl white">아킬레스건 통증, 위치부터 다시 나눈다</text><text x="48" y="90" class="tx m white">중간부 · 부착부 · 파열 의심 · 다른 원인을 같은 통증으로 묶지 않는다</text>
<rect x="22" y="130" width="348" height="560" rx="20" class="card"/><text x="45" y="168" class="tx h l">해부와 surface landmark</text>
<path class="skin" d="M110 210 C110 170 153 150 190 173 C225 194 236 248 230 328 L222 468 C219 518 245 548 287 561 C321 572 337 605 315 631 C286 666 219 658 182 630 C160 613 145 585 146 540 L150 331 C149 270 126 251 110 210Z"/>
<path class="muscle" d="M135 205 C154 171 201 172 218 208 L208 350 C194 373 167 374 150 350Z"/><path class="tendon" d="M166 338 C178 328 194 329 205 340 L198 552 C193 573 171 575 165 553Z"/><path class="bone" d="M157 555 C165 535 203 535 215 555 C237 593 225 624 191 632 C158 624 143 594 157 555Z"/>
<rect x="260" y="326" width="84" height="108" rx="12" class="blue"/><text x="273" y="355" class="tx h m">중간부</text><text x="273" y="382" class="tx s">부착부 위</text><text x="273" y="407" class="tx s">2–6 cm</text><line x1="252" y1="380" x2="204" y2="395" class="line"/><circle cx="199" cy="397" r="14" fill="#e95b52" opacity=".78"/>
<rect x="260" y="462" width="84" height="86" rx="12" class="red"/><text x="273" y="492" class="tx h m">부착부</text><text x="273" y="520" class="tx s">종골과 만나는 곳</text><line x1="252" y1="510" x2="194" y2="556" class="line"/><circle cx="191" cy="557" r="14" fill="#df4b47" opacity=".8"/>
<text x="46" y="590" class="tx h m">기능/부하</text><text x="46" y="618" class="tx s">• 달리기 · 점프 · heel raise</text><text x="46" y="644" class="tx s">• 위치와 같은 familiar pain 재현 여부</text><text x="46" y="670" class="tx s">• 다음 날 stiffness까지 기록</text>
<rect x="392" y="130" width="386" height="560" rx="20" class="card"/><text x="415" y="168" class="tx h l">위치에 따른 핵심 분기</text>
<rect x="414" y="192" width="342" height="112" rx="16" class="blue"/><text x="432" y="224" class="tx h m">① 중간부 건병증</text><text x="432" y="252" class="tx s">2–6 cm 위 · 반복 부하에서 familiar pain</text><text x="432" y="278" class="tx s">KEEP: 기능이 서서히 회복되고 red flag 없음</text>
<rect x="414" y="322" width="342" height="112" rx="16" class="amber"/><text x="432" y="354" class="tx h m">② 부착부 phenotype</text><text x="432" y="382" class="tx s">0–2 cm · 뒤꿈치 압박/큰 배측굴곡에서 악화</text><text x="432" y="408" class="tx s">→ 압박 관리 · 점액낭/후방 충돌 분리</text>
<rect x="414" y="452" width="342" height="112" rx="16" class="red"/><text x="432" y="484" class="tx h m">③ 파열/부분파열 의심</text><text x="432" y="512" class="tx s">새 ‘뚝’ 느낌 · push-off 급감 · heel raise 불가</text><text x="432" y="538" class="tx s">→ 국소 자극 중단 · 영상/정형 평가 우선</text>
<rect x="414" y="582" width="342" height="82" rx="16" fill="#eef3f8"/><text x="432" y="612" class="tx h m">④ 다른 원인</text><text x="432" y="640" class="tx s">외측 저림(sural nerve) · 점액낭 · 염증성 enthesitis</text>
<rect x="22" y="716" width="756" height="180" rx="20" fill="#173f72"/><text x="48" y="754" class="tx h l white">임상에서 기억할 두 문장</text><text x="50" y="800" class="tx h m white">1. 압통점 하나보다 통증 위치 + 부하 과제 + 기능 저하를 함께 본다.</text><text x="50" y="838" class="tx m white">2. 표면 landmark는 안전한 깊은 자침 경로가 아니다.</text><text x="50" y="870" class="tx s white">외측 sural nerve 및 후방 발목의 신경·혈관 구조를 고려하며 blind deep needling 방향은 제시하지 않습니다.</text></svg>
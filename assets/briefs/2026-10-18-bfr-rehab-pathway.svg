<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">혈류제한 저부하 운동의 선별과 4주 재평가 경로</title>
  <desc id="desc">고부하 운동 내약성, 혈관 및 신경 위험 선별, 개별 AOP 확인, 저부하 운동 시험, 중단 기준과 2주·4주 재평가를 연결한 의사결정 도식</desc>
  <rect width="800" height="600" fill="#f5f8f9"/>
  <text x="52" y="54" fill="#20333d" font-family="Arial, Noto Sans KR, sans-serif" font-size="28" font-weight="700">BFR은 고부하 운동의 ‘대체 만능키’가 아니다</text>
  <text x="52" y="84" fill="#526771" font-family="Arial, Noto Sans KR, sans-serif" font-size="15">안전 선별 → 개별 압력 → 저부하 시험 → 같은 기능지표로 재평가</text>

  <g font-family="Arial, Noto Sans KR, sans-serif">
    <rect x="52" y="118" width="696" height="72" rx="16" fill="#e7eef2" stroke="#9fb5c0"/>
    <circle cx="88" cy="154" r="20" fill="#304a59"/><text x="88" y="160" text-anchor="middle" fill="white" font-size="16" font-weight="700">1</text>
    <text x="122" y="146" fill="#20333d" font-size="18" font-weight="700">먼저 질문: 고부하를 실제로 견딜 수 없는가?</text>
    <text x="122" y="171" fill="#526771" font-size="14">가능하면 표준 점진 저항운동이 우선 · 불가능/통증 제한이면 BFR을 보조 선택지로 검토</text>

    <path d="M400 190v24" stroke="#7b929d" stroke-width="3" marker-end="url(#a)"/>
    <rect x="52" y="216" width="696" height="88" rx="16" fill="#fff" stroke="#d3dde1"/>
    <circle cx="88" cy="260" r="20" fill="#304a59"/><text x="88" y="266" text-anchor="middle" fill="white" font-size="16" font-weight="700">2</text>
    <text x="122" y="246" fill="#20333d" font-size="18" font-weight="700">혈관·신경·전신 위험 선별</text>
    <text x="122" y="271" fill="#526771" font-size="14">말초혈관질환·해당 사지 혈관수술/AV fistula → 시행하지 않음</text>
    <text x="122" y="291" fill="#8a4b48" font-size="14">VTE·고혈압·출혈/응고질환·뇌졸중·말초신경병증 의심 → 의학적 검토 먼저</text>

    <path d="M400 304v24" stroke="#7b929d" stroke-width="3" marker-end="url(#a)"/>
    <rect x="52" y="330" width="696" height="72" rx="16" fill="#eaf2ed" stroke="#a8c1b4"/>
    <circle cx="88" cy="366" r="20" fill="#45665a"/><text x="88" y="372" text-anchor="middle" fill="white" font-size="16" font-weight="700">3</text>
    <text x="122" y="358" fill="#20333d" font-size="18" font-weight="700">개별 AOP 확인 + 익숙화 세션</text>
    <text x="122" y="383" fill="#526771" font-size="14">같은 커프·같은 자세로 측정 · 임의 mmHg 금지 · 첫 회는 감독과 저부하로 시작</text>

    <path d="M400 402v24" stroke="#7b929d" stroke-width="3" marker-end="url(#a)"/>
    <rect x="52" y="428" width="336" height="116" rx="16" fill="#eef3f5" stroke="#b9c8cf"/>
    <text x="76" y="460" fill="#20333d" font-size="17" font-weight="700">유지 · 점진</text>
    <text x="76" y="487" fill="#526771" font-size="14">2주: 피부·감각·어지럼·압력·순응도</text>
    <text x="76" y="511" fill="#526771" font-size="14">4주: 30초 의자일어나기·근력·PSFS</text>
    <text x="76" y="535" fill="#45665a" font-size="14" font-weight="700">기능↑, 위해 없음 → 한 변수씩 진행</text>

    <rect x="412" y="428" width="336" height="116" rx="16" fill="#f7eae8" stroke="#d6b0ad"/>
    <text x="436" y="460" fill="#20333d" font-size="17" font-weight="700">즉시 중단 · 변경</text>
    <text x="436" y="487" fill="#526771" font-size="14">지속 저림·창백/청색·심한 통증·어지럼</text>
    <text x="436" y="511" fill="#526771" font-size="14">호흡곤란·흉통·편측 종창/열감</text>
    <text x="436" y="535" fill="#844c49" font-size="14" font-weight="700">압력/방법 재평가 또는 의학적 평가</text>
  </g>
  <defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#7b929d"/></marker></defs>
  <text x="52" y="578" fill="#6b777b" font-family="Arial, Noto Sans KR, sans-serif" font-size="13">BFR은 진단 도구가 아니며, 통증 감소만으로 계속하지 않는다.</text>
</svg>

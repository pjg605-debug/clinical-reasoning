<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1080" viewBox="0 0 800 1080" role="img" aria-labelledby="t d">
<title id="t">아킬레스건 통증 재평가 순서</title><desc id="d">통증 위치, 발목 가동범위, 한 발 까치발, 파열 screen, 24시간 부하 반응, 유지와 변경 기준을 보여주는 임상 진찰 인포그래픽</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f8fbfe"/><stop offset="1" stop-color="#edf5f9"/></linearGradient><style>.tx{font-family:Pretendard,'Noto Sans KR','Apple SD Gothic Neo',sans-serif;fill:#173b67}.h{font-weight:900}.m{font-size:18px}.s{font-size:15px}.l{font-size:27px}.xl{font-size:36px}.card{fill:#fff;stroke:#c8dae6;stroke-width:2}.blue{fill:#eaf4fb}.green{fill:#e8f7ef}.red{fill:#fdeceb}.amber{fill:#fff4da}.num{fill:#1b68a6}.white{fill:#fff}.line{stroke:#527b98;stroke-width:3;fill:none;stroke-linecap:round}</style></defs>
<rect width="800" height="1080" fill="url(#bg)"/><rect x="22" y="20" width="756" height="90" rx="18" fill="#173f72"/><text x="46" y="60" class="tx h xl white">아킬레스건 통증, 다음 진료에서 다시 보는 순서</text><text x="46" y="91" class="tx m white">통증점보다 위치 · 부하 재현 · 기능 · 파열 신호를 함께 확인</text>
<g transform="translate(22 136)"><rect width="360" height="230" rx="18" class="card"/><circle cx="40" cy="40" r="25" class="num"/><text x="32" y="48" class="tx h m white">1</text><text x="78" y="47" class="tx h l">통증 위치 다시 표시</text><path d="M52 92 C78 74 112 80 121 112 L116 188 C106 210 72 210 61 188Z" fill="#f2c7a7" stroke="#c99a7a" stroke-width="2"/><path d="M83 108 L84 176" stroke="#eee8db" stroke-width="15"/><circle cx="84" cy="129" r="11" fill="#e55350"/><circle cx="84" cy="176" r="11" fill="#cf3f3b"/><text x="142" y="105" class="tx h m">중간부 2–6 cm</text><text x="142" y="136" class="tx s">러닝·점프·heel raise</text><text x="142" y="173" class="tx h m">부착부 0–2 cm</text><text x="142" y="204" class="tx s">신발 압박·큰 배측굴곡</text></g>
<g transform="translate(418 136)"><rect width="360" height="230" rx="18" class="card"/><circle cx="40" cy="40" r="25" class="num"/><text x="32" y="48" class="tx h m white">2</text><text x="78" y="47" class="tx h l">발목 가동범위</text><line x1="72" y1="184" x2="270" y2="184" class="line"/><line x1="275" y1="90" x2="275" y2="184" class="line"/><path d="M136 172 C149 139 164 116 182 96" class="line"/><circle cx="182" cy="96" r="10" fill="#f2c7a7"/><text x="82" y="88" class="tx h m">knee-to-wall</text><text x="82" y="118" class="tx s">좌우 거리·통증 비교</text><text x="82" y="148" class="tx s">ROM 하나로 확진하지 않음</text></g>
<g transform="translate(22 392)"><rect width="360" height="230" rx="18" class="card"/><circle cx="40" cy="40" r="25" class="num"/><text x="32" y="48" class="tx h m white">3</text><text x="78" y="47" class="tx h l">한 발 까치발</text><path d="M72 173 C105 153 124 134 136 100" class="line"/><path d="M168 173 C193 143 203 118 207 90" class="line"/><line x1="230" y1="82" x2="230" y2="171" stroke="#2a83bd" stroke-width="4"/><polygon points="230,75 222,90 238,90" fill="#2a83bd"/><polygon points="230,178 222,163 238,163" fill="#2a83bd"/><text x="255" y="94" class="tx h m">4개 기록</text><text x="255" y="126" class="tx s">① 반복 횟수</text><text x="255" y="151" class="tx s">② 뒤꿈치 높이</text><text x="255" y="176" class="tx s">③ familiar pain</text><text x="255" y="201" class="tx s">④ 좌우 차이</text></g>
<g transform="translate(418 392)"><rect width="360" height="230" rx="18" class="card"/><circle cx="40" cy="40" r="25" class="num"/><text x="32" y="48" class="tx h m white">4</text><text x="78" y="47" class="tx h l">파열 screen</text><path d="M65 125 C120 93 176 94 235 112" stroke="#f0c5a4" stroke-width="32" fill="none" stroke-linecap="round"/><path d="M232 112 C260 124 276 147 286 171" stroke="#f0c5a4" stroke-width="22" fill="none" stroke-linecap="round"/><path d="M140 92 L140 128" stroke="#d54845" stroke-width="7"/><polygon points="140,139 129,120 151,120" fill="#d54845"/><text x="76" y="172" class="tx h m">새 ‘뚝’ + 급성 힘 빠짐?</text><text x="76" y="202" class="tx s">Thompson-type 이상 → 영상/의뢰 우선</text></g>
<g transform="translate(22 648)"><rect width="756" height="198" rx="18" class="card"/><circle cx="40" cy="40" r="25" class="num"/><text x="32" y="48" class="tx h m white">5</text><text x="78" y="47" class="tx h l">24시간 부하 반응</text><rect x="48" y="80" width="310" height="92" rx="14" class="green"/><text x="66" y="110" class="tx h m">허용 가능한 반응</text><text x="66" y="140" class="tx s">운동 중 경미한 통증 → 다음 날 기준선 회복</text><rect x="396" y="80" width="312" height="92" rx="14" class="red"/><text x="414" y="110" class="tx h m">과도한 반응</text><text x="414" y="140" class="tx s">다음 날 통증·뻣뻣함이 뚜렷하게 증가</text><text x="48" y="190" class="tx s">압통점만 쫓기보다 운동량을 이 24시간 반응에 맞춰 조절합니다.</text></g>
<g transform="translate(22 872)"><rect width="756" height="178" rx="18" class="card"/><circle cx="40" cy="40" r="25" class="num"/><text x="32" y="48" class="tx h m white">6</text><text x="78" y="47" class="tx h l">유지 vs 변경</text><rect x="48" y="76" width="310" height="78" rx="14" class="green"/><text x="66" y="106" class="tx h m">KEEP</text><text x="66" y="135" class="tx s">같은 midportion pain + 기능 점진 개선 + red flag 없음</text><rect x="396" y="76" width="312" height="78" rx="14" class="red"/><text x="414" y="106" class="tx h m">CHANGE</text><text x="414" y="135" class="tx s">새 weakness · rupture sign · neural/systemic clue · 4–6주 기능 정체</text></g></svg>
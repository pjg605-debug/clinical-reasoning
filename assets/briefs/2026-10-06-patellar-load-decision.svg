<svg xmlns="http://www.w3.org/2000/svg" width="800" height="835" viewBox="0 0 800 835" role="img" aria-label="슬개건병증 · 유지/변경"><rect width="800" height="100%" fill="#fff"/><g fill="#244451" font-family="Noto Sans KR,Arial,sans-serif"><text x="28" y="57" font-size="32" font-weight="700">슬개건병증 · 유지/변경</text><text x="28" y="89" font-size="20">교육용 판단 흐름 · 단일 소견으로 확진하지 않음</text><rect x="28" y="116" width="744" height="119" rx="16" fill="#eaf2f6"/><text x="50" y="155" font-size="27" font-weight="700">슬개건병증 ↑, 유지</text><text x="50" y="194" font-size="23">저항운동과 경기 부하를 각각 기록하고 점진적 진행</text><rect x="28" y="265" width="744" height="153" rx="16" fill="#eef5ec"/><text x="50" y="304" font-size="27" font-weight="700">PFP ↑, 공존 가능</text><text x="50" y="343" font-size="23">무릎·고관절 운동과 계단 과제 검토; 하극 건</text><text x="50" y="377" font-size="23">통증도 별도 추적</text><rect x="28" y="448" width="744" height="153" rx="16" fill="#fcf0e9"/><text x="50" y="487" font-size="27" font-weight="700">Hoffa 등 앞무릎 감별 ↑</text><text x="50" y="526" font-size="23">신전 과부하 조절; 영상 신호 하나로 지방체 통증</text><text x="50" y="560" font-size="23">확정하지 않음</text><rect x="28" y="631" width="744" height="119" rx="16" fill="#eaf2f6"/><text x="50" y="670" font-size="27" font-weight="700">신전기전 손상/관절내 병변 ↑</text><text x="50" y="709" font-size="23">점프·강한 운동 중단, 신속한 영상/정형 평가</text><text x="28" y="805" font-size="20">다음 방문: 같은 조건의 기능과 안전 소견을 함께 확인</text></g></svg>
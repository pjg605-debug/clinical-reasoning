<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><defs><style>.sans{font-family:"Noto Sans KR","Pretendard","Apple SD Gothic Neo",Arial,sans-serif}.title{font-size:40px;font-weight:900;fill:white}.sub{font-size:20px;font-weight:700;fill:#dcebf5}.h{font-size:24px;font-weight:900;fill:#124d7a}.t{font-size:18px;font-weight:650;fill:#233942}.sm{font-size:15px;font-weight:600;fill:#52656d}</style></defs><rect width="1200" height="760" fill="#f6fafc"/><rect width="1200" height="112" fill="#125a8e"/><text x="38" y="54" class="sans title">경추 신경성 통증: 진찰은 한 가지 특수검사가 아니라 묶음으로</text><text x="38" y="88" class="sans sub">증상 재현 → 객관적 신경학적 결손 → 여러 검사 결과의 방향을 함께 봅니다</text><g transform="translate(28,142)"><rect width="270" height="430" rx="20" fill="#fff" stroke="#bfd7e4" stroke-width="2"/><text x="22" y="44" class="sans h">1  경추 ROM</text><circle cx="135" cy="145" r="48" fill="#efc4ab" stroke="#a97b69" stroke-width="2"/><path d="M108 190 C96 220,96 263,104 300 L166 300 C174 263,174 220,162 190 Z" fill="#e5baa4"/><path d="M78 140 Q135 90 192 140" fill="none" stroke="#1e78b0" stroke-width="9"/><polygon points="77,140 92,129 89,148" fill="#1e78b0"/><polygon points="193,140 178,129 181,148" fill="#1e78b0"/><text x="22" y="334" class="sans t">• 회전·신전·측굴에서</text><text x="22" y="364" class="sans t">  익숙한 팔 증상이 변하는가?</text><text x="22" y="398" class="sans sm">방향성 변화는 “어디서 오는가”를</text><text x="22" y="422" class="sans sm">가설화하는 단서이지 확진은 아닙니다.</text></g><g transform="translate(316,142)"><rect width="270" height="430" rx="20" fill="#fff" stroke="#bfd7e4" stroke-width="2"/><text x="22" y="44" class="sans h">2  Spurling</text><circle cx="135" cy="150" r="48" fill="#efc4ab" stroke="#a97b69" stroke-width="2"/><path d="M110 193 C101 226,102 260,108 300 L164 300 C170 260,170 226,160 193 Z" fill="#e5baa4"/><path d="M93 112 L64 88" stroke="#c43e3e" stroke-width="12" stroke-linecap="round"/><path d="M167 112 L198 88" stroke="#c43e3e" stroke-width="12" stroke-linecap="round"/><path d="M125 92 Q140 70 158 91" fill="none" stroke="#c43e3e" stroke-width="8"/><text x="22" y="334" class="sans t">• 환자에게 익숙한 팔 증상 재현?</text><text x="22" y="364" class="sans t">• 목 통증만 늘어난 것은 구분</text><text x="22" y="398" class="sans sm">2026 review: specificity는 높은 편이지만</text><text x="22" y="422" class="sans sm">방법 차이와 very-low certainty를 고려.</text></g><g transform="translate(604,142)"><rect width="270" height="430" rx="20" fill="#fff" stroke="#bfd7e4" stroke-width="2"/><text x="22" y="44" class="sans h">3  ULNT</text><circle cx="80" cy="151" r="38" fill="#efc4ab" stroke="#a97b69" stroke-width="2"/><path d="M65 187 C54 220,57 265,63 299 L105 299 C110 261,110 220,98 187 Z" fill="#e5baa4"/><path d="M100 205 C142 182,182 160,228 125" fill="none" stroke="#e2b69f" stroke-width="26" stroke-linecap="round"/><path d="M106 201 C147 181,184 158,225 126" fill="none" stroke="#1b8a84" stroke-width="8" stroke-linecap="round"/><text x="22" y="334" class="sans t">• 구조별 순서로 가동해</text><text x="22" y="364" class="sans t">  익숙한 저림/통증이 변하는가?</text><text x="22" y="398" class="sans sm">4-ULNT cluster는 rule-out에 도움될 수</text><text x="22" y="422" class="sans sm">있지만 단독 확진검사는 아닙니다.</text></g><g transform="translate(892,142)"><rect width="280" height="430" rx="20" fill="#fff" stroke="#bfd7e4" stroke-width="2"/><text x="22" y="44" class="sans h">4  Neuro screen</text><circle cx="75" cy="150" r="34" fill="#efc4ab"/><line x1="75" y1="185" x2="75" y2="275" stroke="#536f7d" stroke-width="10"/><line x1="75" y1="205" x2="34" y2="244" stroke="#536f7d" stroke-width="10"/><line x1="75" y1="205" x2="116" y2="244" stroke="#536f7d" stroke-width="10"/><path d="M150 132 H240" stroke="#df9b00" stroke-width="12" stroke-linecap="round"/><path d="M150 180 H240" stroke="#3aa667" stroke-width="12" stroke-linecap="round"/><path d="M150 228 H240" stroke="#d65472" stroke-width="12" stroke-linecap="round"/><text x="22" y="334" class="sans t">• myotome: 좌우 근력 비교</text><text x="22" y="364" class="sans t">• 감각: 피부분절 변화 확인</text><text x="22" y="394" class="sans t">• reflex: 이두·상완요골·삼두</text><text x="22" y="424" class="sans sm">객관적 결손이 반복되면 진단 가중치가</text><text x="22" y="448" class="sans sm">특수검사 한 개보다 크게 바뀝니다.</text></g><rect x="28" y="600" width="1144" height="128" rx="18" fill="#eaf3f7" stroke="#bdd4df" stroke-width="2"/><text x="48" y="636" class="sans h">실전 순서</text><rect x="164" y="616" width="180" height="78" rx="14" fill="#fff"/><text x="184" y="649" class="sans t">병력·증상 분포</text><text x="184" y="678" class="sans sm">팔꿈치 아래? 손가락?</text><text x="351" y="662" class="sans h">→</text><rect x="390" y="616" width="180" height="78" rx="14" fill="#fff"/><text x="410" y="649" class="sans t">Neuro screen</text><text x="410" y="678" class="sans sm">근력·감각·반사</text><text x="577" y="662" class="sans h">→</text><rect x="616" y="616" width="180" height="78" rx="14" fill="#fff"/><text x="636" y="649" class="sans t">ROM + tests</text><text x="636" y="678" class="sans sm">Spurling·ULNT</text><text x="803" y="662" class="sans h">→</text><rect x="842" y="616" width="290" height="78" rx="14" fill="#fff"/><text x="862" y="649" class="sans t">유지 vs 계획 변경</text><text x="862" y="678" class="sans sm">진행성 deficit이면 의뢰 우선</text><text x="48" y="714" class="sans sm" fill="#8a2f2f">주의: 하나의 검사 양성, 하나의 압통점, 치료 직후 호전만으로 경추 신경근병증을 확정하지 않습니다.</text></svg>
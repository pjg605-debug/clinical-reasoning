<svg xmlns="http://www.w3.org/2000/svg" width="800" height="801" viewBox="0 0 800 801" role="img" aria-label="근위 햄스트링 통증 · 유지/변경"><rect width="800" height="100%" fill="#fff"/><g fill="#244451" font-family="Noto Sans KR,Arial,sans-serif"><text x="28" y="57" font-size="32" font-weight="700">근위 햄스트링 통증 · 유지/변경</text><text x="28" y="89" font-size="20">교육용 판단 흐름 · 단일 소견으로 확진하지 않음</text><rect x="28" y="116" width="744" height="119" rx="16" fill="#eaf2f6"/><text x="50" y="155" font-size="27" font-weight="700">근위 햄스트링병증 ↑, 유지</text><text x="50" y="194" font-size="23">압박 노출·달리기·저항운동 단계 조정</text><rect x="28" y="265" width="744" height="119" rx="16" fill="#eef5ec"/><text x="50" y="304" font-size="27" font-weight="700">건 파열/박리 ↑</text><text x="50" y="343" font-size="23">US/MRI 및 정형 평가 우선</text><rect x="28" y="414" width="744" height="119" rx="16" fill="#fcf0e9"/><text x="50" y="453" font-size="27" font-weight="700">신경/요추 가중치 ↑</text><text x="50" y="492" font-size="23">신경 bundle과 필요 시 영상/의뢰</text><rect x="28" y="563" width="744" height="153" rx="16" fill="#eaf2f6"/><text x="50" y="602" font-size="27" font-weight="700">US 한계/다른 구조 고려</text><text x="50" y="641" font-size="23">검사자·영상 질을 검토하고 MRI가 결정을 바꾸면</text><text x="50" y="675" font-size="23">의뢰</text><text x="28" y="771" font-size="20">다음 방문: 같은 조건의 기능과 안전 소견을 함께 확인</text></g></svg>
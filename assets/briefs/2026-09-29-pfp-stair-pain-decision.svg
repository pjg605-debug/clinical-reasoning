<svg xmlns="http://www.w3.org/2000/svg" width="800" height="903" viewBox="0 0 800 903" role="img" aria-label="슬개대퇴 통증 · 유지/변경"><rect width="800" height="100%" fill="#fff"/><g fill="#244451" font-family="Noto Sans KR,Arial,sans-serif"><text x="28" y="57" font-size="32" font-weight="700">슬개대퇴 통증 · 유지/변경</text><text x="28" y="89" font-size="20">교육용 판단 흐름 · 단일 소견으로 확진하지 않음</text><rect x="28" y="116" width="744" height="153" rx="16" fill="#eaf2f6"/><text x="50" y="155" font-size="27" font-weight="700">PFP ↑, 원래 진단 유지</text><text x="50" y="194" font-size="23">저항운동과 계단 과제의 빈도·깊이·저항 중 하나를</text><text x="50" y="228" font-size="23">조절하고 기록</text><rect x="28" y="299" width="744" height="153" rx="16" fill="#eef5ec"/><text x="50" y="338" font-size="27" font-weight="700">슬개건병증 ↑, 공존 가능</text><text x="50" y="377" font-size="23">건 부하 패턴과 최근 점프량 평가; 필요한 경우</text><text x="50" y="411" font-size="23">US, 즉시 PFP 삭제하지 않음</text><rect x="28" y="482" width="744" height="153" rx="16" fill="#fcf0e9"/><text x="50" y="521" font-size="27" font-weight="700">Hoffa 관련 가능성 ↑</text><text x="50" y="560" font-size="23">신전 과부하를 조절하되 단일 유발검사로 확진하지</text><text x="50" y="594" font-size="23">않음</text><rect x="28" y="665" width="744" height="153" rx="16" fill="#eaf2f6"/><text x="50" y="704" font-size="27" font-weight="700">관절내 병변/손상 ↑</text><text x="50" y="743" font-size="23">강한 운동·국소 침 반복을 중단하고 영상/정형 평가</text><text x="50" y="777" font-size="23">우선</text><text x="28" y="873" font-size="20">다음 방문: 같은 조건의 기능과 안전 소견을 함께 확인</text></g></svg>
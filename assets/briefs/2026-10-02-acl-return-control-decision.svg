<svg xmlns="http://www.w3.org/2000/svg" width="800" height="801" viewBox="0 0 800 801" role="img" aria-label="ACL 재건 재활 · 유지/변경"><rect width="800" height="100%" fill="#fff"/><g fill="#244451" font-family="Noto Sans KR,Arial,sans-serif"><text x="28" y="57" font-size="32" font-weight="700">ACL 재건 재활 · 유지/변경</text><text x="28" y="89" font-size="20">교육용 판단 흐름 · 단일 소견으로 확진하지 않음</text><rect x="28" y="116" width="744" height="119" rx="16" fill="#eaf2f6"/><text x="50" y="155" font-size="27" font-weight="700">기능 재활 필요 가중치 ↑</text><text x="50" y="194" font-size="23">지도 재활·단계적 스포츠 과제 지속</text><rect x="28" y="265" width="744" height="119" rx="16" fill="#eef5ec"/><text x="50" y="304" font-size="27" font-weight="700">대칭 수치의 설명력 ↓</text><text x="50" y="343" font-size="23">절대 근력·수행 질과 실제 요구를 추가</text><rect x="28" y="414" width="744" height="119" rx="16" fill="#fcf0e9"/><text x="50" y="453" font-size="27" font-weight="700">재손상/관절 문제 ↑</text><text x="50" y="492" font-size="23">스포츠 부하 중단·수술팀 평가</text><rect x="28" y="563" width="744" height="153" rx="16" fill="#eaf2f6"/><text x="50" y="602" font-size="27" font-weight="700">심리적 준비 결손 ↑</text><text x="50" y="641" font-size="23">협의한 점진 노출·지원, 시점만으로 복귀 허가하지</text><text x="50" y="675" font-size="23">않음</text><text x="28" y="771" font-size="20">다음 방문: 같은 조건의 기능과 안전 소견을 함께 확인</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="801" viewBox="0 0 800 801" role="img" aria-label="급성 요통 영상 결정 · 유지/변경"><rect width="800" height="100%" fill="#fff"/><g fill="#244451" font-family="Noto Sans KR,Arial,sans-serif"><text x="28" y="57" font-size="32" font-weight="700">급성 요통 영상 결정 · 유지/변경</text><text x="28" y="89" font-size="20">교육용 판단 흐름 · 단일 소견으로 확진하지 않음</text><rect x="28" y="116" width="744" height="153" rx="16" fill="#eaf2f6"/><text x="50" y="155" font-size="27" font-weight="700">비특이적 급성 요통 유지</text><text x="50" y="194" font-size="23">즉시 MRI 대신 활동/교육·재평가와 safety-</text><text x="50" y="228" font-size="23">net</text><rect x="28" y="299" width="744" height="119" rx="16" fill="#eef5ec"/><text x="50" y="338" font-size="27" font-weight="700">신경 중요도 ↑</text><text x="50" y="377" font-size="23">협진/영상 필요성 조속 평가</text><rect x="28" y="448" width="744" height="119" rx="16" fill="#fcf0e9"/><text x="50" y="487" font-size="27" font-weight="700">마미 위험 ↑</text><text x="50" y="526" font-size="23">즉시 응급 평가</text><rect x="28" y="597" width="744" height="119" rx="16" fill="#eaf2f6"/><text x="50" y="636" font-size="27" font-weight="700">특이 원인 위험 ↑</text><text x="50" y="675" font-size="23">긴급도에 따른 검사/의뢰</text><text x="28" y="771" font-size="20">다음 방문: 같은 조건의 기능과 안전 소견을 함께 확인</text></g></svg>
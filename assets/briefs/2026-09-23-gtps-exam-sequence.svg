<svg xmlns="http://www.w3.org/2000/svg" width="800" height="980" viewBox="0 0 800 980"><defs><style>.bg{fill:#f7fbfe}.panel{fill:#fff;stroke:#c9dce8;stroke-width:2}.h{font:700 30px Pretendard,'Noto Sans KR',sans-serif;fill:#163d68}.t{font:700 18px Pretendard,'Noto Sans KR',sans-serif;fill:#1f4e79}.s{font:650 14px Pretendard,'Noto Sans KR',sans-serif;fill:#2e4355}.sm{font:500 12px Pretendard,'Noto Sans KR',sans-serif;fill:#4a6172}.n{fill:#1f6fb1}.num{font:700 18px Pretendard,'Noto Sans KR',sans-serif;fill:#fff}.red{fill:#dd5b5b}.green{fill:#56a46a}.amber{fill:#e6a947}.blue{fill:#6aa8dd}.body{stroke:#c6a58e;stroke-width:20;stroke-linecap:round;fill:none}.line{stroke:#2e6793;stroke-width:4;fill:none}.arr{stroke:#dd5b5b;stroke-width:4;fill:none;marker-end:url(#m)}</style><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#dd5b5b"/></marker></defs><rect class="bg" width="800" height="980"/><text x="34" y="52" class="h">GTPS 재평가: 한 검사가 아니라 ‘묶음’으로 본다</text><text x="34" y="82" class="s">각 검사는 같은 익숙한 통증을 재현하는지, 다른 가설을 더 잘 설명하는지 확인합니다.</text>
<g transform="translate(28,115)"><rect width="356" height="180" rx="16" class="panel"/><circle cx="34" cy="34" r="20" class="n"/><text x="28" y="41" class="num">1</text><text x="64" y="40" class="t">대전자 촉진 + 통증 지도</text><circle cx="115" cy="93" r="18" fill="#e7c2a8"/><path d="M102 113 L128 113 L140 160 L90 160Z" fill="#efcfba"/><ellipse cx="95" cy="130" rx="24" ry="34" class="red" opacity=".6"/><path d="M175 125 L120 132" class="arr"/><text x="175" y="95" class="s">익숙한 외측 통증?</text><text x="175" y="118" class="sm">한 점보다 주변 분포를 확인</text><text x="175" y="142" class="sm">서혜부·무릎 아래 통증도 기록</text></g>
<g transform="translate(416,115)"><rect width="356" height="180" rx="16" class="panel"/><circle cx="34" cy="34" r="20" class="n"/><text x="28" y="41" class="num">2</text><text x="64" y="40" class="t">30초 single-leg stance</text><circle cx="95" cy="82" r="18" fill="#e7c2a8"/><path d="M95 100 L95 145" class="body"/><path d="M95 120 L65 145 M95 120 L125 142" class="body"/><path d="M95 145 L92 170 M95 145 L130 170" class="body"/><path d="M65 160 C110 145 145 146 178 160" class="line"/><text x="175" y="92" class="s">같은 통증이 재현되는가?</text><text x="175" y="118" class="sm">골반 drop/몸통 보상도 관찰</text><text x="175" y="144" class="sm">단독 양성 = 확진 아님</text></g>
<g transform="translate(28,315)"><rect width="356" height="180" rx="16" class="panel"/><circle cx="34" cy="34" r="20" class="n"/><text x="28" y="41" class="num">3</text><text x="64" y="40" class="t">저항성 외전 / external derotation</text><path d="M60 125 L155 125" class="body"/><path d="M145 125 L205 100" class="body"/><path d="M205 100 L245 118" class="body"/><path d="M235 80 L210 105" class="arr"/><text x="175" y="78" class="s">통증 + 힘 저하를 분리</text><text x="175" y="144" class="sm">통증만? 실제 외전 약화?</text><text x="175" y="165" class="sm">갑작스런 약화면 tear 가중치 ↑</text></g>
<g transform="translate(416,315)"><rect width="356" height="180" rx="16" class="panel"/><circle cx="34" cy="34" r="20" class="n"/><text x="28" y="41" class="num">4</text><text x="64" y="40" class="t">hip ROM + FABER/FADIR</text><path d="M60 130 L145 130" class="body"/><path d="M138 130 L180 92" class="body"/><path d="M180 92 L220 126" class="body"/><path d="M175 75 Q205 92 220 120" class="arr"/><text x="235" y="90" class="s">서혜부 깊은 통증?</text><text x="235" y="116" class="sm">내회전 제한?</text><text x="235" y="142" class="sm">관절내 가설을 비교</text></g>
<g transform="translate(28,515)"><rect width="356" height="180" rx="16" class="panel"/><circle cx="34" cy="34" r="20" class="n"/><text x="28" y="41" class="num">5</text><text x="64" y="40" class="t">요추 / 신경학적 screen</text><path d="M92 78 L92 144" class="body"/><path d="M92 98 L60 130 M92 98 L125 130" class="body"/><path d="M92 144 L70 170 M92 144 L122 170" class="body"/><path d="M123 112 C160 128 185 145 205 166" stroke="#56a46a" stroke-width="16" fill="none" opacity=".6"/><text x="175" y="80" class="s">무릎 아래 저림·감각 변화?</text><text x="175" y="108" class="sm">myotome / dermatome / reflex</text><text x="175" y="132" class="sm">허리 움직임에 따라 증상 변화?</text></g>
<g transform="translate(416,515)"><rect width="356" height="180" rx="16" class="panel"/><circle cx="34" cy="34" r="20" class="n"/><text x="28" y="41" class="num">6</text><text x="64" y="40" class="t">기능지표를 같은 조건으로 반복</text><rect x="50" y="78" width="90" height="70" rx="12" fill="#edf5ff"/><text x="66" y="103" class="s">PSFS</text><text x="60" y="130" class="sm">옆으로 눕기</text><rect x="150" y="78" width="90" height="70" rx="12" fill="#eef9f1"/><text x="164" y="103" class="s">계단</text><text x="162" y="130" class="sm">한 층/통증</text><rect x="250" y="78" width="80" height="70" rx="12" fill="#fff5e8"/><text x="263" y="103" class="s">SLS</text><text x="258" y="130" class="sm">30초</text></g>
<rect x="28" y="720" width="744" height="200" rx="18" class="panel"/><text x="48" y="755" class="t">결과를 행동으로 바꾸는 기준</text><rect x="48" y="780" width="215" height="112" rx="14" fill="#eef9f1"/><text x="64" y="807" class="s">GTPS 가설 유지</text><text x="64" y="833" class="sm">외측 통증 + 부하 재현</text><text x="64" y="854" class="sm">hip ROM·neuro screen 비특이적</text><text x="64" y="875" class="sm">→ compression 관리 + loading</text><rect x="292" y="780" width="215" height="112" rx="14" fill="#fff4e6"/><text x="308" y="807" class="s">영상/의뢰 앞당김</text><text x="308" y="833" class="sm">새 외전 약화·Trendelenburg</text><text x="308" y="854" class="sm">외상·기능 급저하</text><text x="308" y="875" class="sm">→ US/MRI·정형 평가</text><rect x="536" y="780" width="215" height="112" rx="14" fill="#fff0ef"/><text x="552" y="807" class="s">다른 가설로 이동</text><text x="552" y="833" class="sm">서혜부+IR 제한 또는</text><text x="552" y="854" class="sm">distal neurologic sign</text><text x="552" y="875" class="sm">→ hip/lumbar 평가 우선</text>
<text x="40" y="950" class="sm">※ 어떤 한 특수검사도 단독 확진 기준으로 쓰지 않습니다. 촉진점은 안전한 깊은 자침 경로를 의미하지 않습니다.</text></svg>
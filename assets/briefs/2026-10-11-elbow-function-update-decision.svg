<svg xmlns="http://www.w3.org/2000/svg" width="800" height="767" viewBox="0 0 800 767" role="img" aria-label="외측 팔꿈치 기능 · 유지/변경"><rect width="800" height="100%" fill="#fff"/><g fill="#244451" font-family="Noto Sans KR,Arial,sans-serif"><text x="28" y="57" font-size="32" font-weight="700">외측 팔꿈치 기능 · 유지/변경</text><text x="28" y="89" font-size="20">교육용 판단 흐름 · 단일 소견으로 확진하지 않음</text><rect x="28" y="116" width="744" height="119" rx="16" fill="#eaf2f6"/><text x="50" y="155" font-size="27" font-weight="700">신전건병증 유지</text><text x="50" y="194" font-size="23">작업·grip·저항운동 부하 단계 조절</text><rect x="28" y="265" width="744" height="119" rx="16" fill="#eef5ec"/><text x="50" y="304" font-size="27" font-weight="700">radial tunnel 등 가중치 ↑</text><text x="50" y="343" font-size="23">감별 bundle, 단일 압통/검사로 확진하지 않음</text><rect x="28" y="414" width="744" height="119" rx="16" fill="#fcf0e9"/><text x="50" y="453" font-size="27" font-weight="700">PIN/신경 중요도 ↑</text><text x="50" y="492" font-size="23">조기 신경/정형 협진</text><rect x="28" y="563" width="744" height="119" rx="16" fill="#eaf2f6"/><text x="50" y="602" font-size="27" font-weight="700">치료 성공 판단 ↓</text><text x="50" y="641" font-size="23">PRTEE·grip/작업 목표 중심으로 계획 재검토</text><text x="28" y="737" font-size="20">다음 방문: 같은 조건의 기능과 안전 소견을 함께 확인</text></g></svg>
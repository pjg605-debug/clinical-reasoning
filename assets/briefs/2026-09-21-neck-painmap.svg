<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900"><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7fbfd"/><stop offset="1" stop-color="#eef5f7"/></linearGradient><linearGradient id="blue" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0c4d82"/><stop offset="1" stop-color="#1973a8"/></linearGradient><style>.sans{font-family:"Noto Sans KR","Pretendard","Apple SD Gothic Neo",Arial,sans-serif}.title{font-size:44px;font-weight:900;fill:#0e4778}.sub{font-size:23px;font-weight:700;fill:#375766}.ph{font-size:25px;font-weight:900;fill:white}.h{font-size:24px;font-weight:900;fill:#173f5b}.t{font-size:19px;font-weight:600;fill:#24363f}.small{font-size:16px;font-weight:600;fill:#4c626c}</style></defs><rect width="1200" height="900" fill="url(#bg)"/><rect x="0" y="0" width="1200" height="128" fill="url(#blue)"/><text x="42" y="58" class="sans title" fill="#fff">급성 경항통: 국소 통증과 신경성 통증을 먼저 나눕니다</text><text x="42" y="98" class="sans sub" fill="#dbeefa">통증의 위치·방사 패턴·신경학적 단서가 치료의 적용 범위를 바꿉니다</text><rect x="28" y="152" rx="22" width="362" height="610" fill="#fff" stroke="#b8d5e2" stroke-width="2"/><rect x="28" y="152" rx="22" width="362" height="64" fill="#176da2"/><text x="52" y="194" class="sans ph">1  국소 neck pain</text><text x="52" y="246" class="sans h">주로 목·견갑대에 국한</text><circle cx="208" cy="342" r="70" fill="#f0c7b0" stroke="#ad7f6d" stroke-width="2"/><path d="M159 405 C120 430,95 520,98 616 L318 616 C321 520,296 430,257 405 Z" fill="#e9c2ad" stroke="#ad7f6d" stroke-width="2"/><path d="M188 395 C165 427,151 472,144 528" fill="none" stroke="#e34845" stroke-width="26" stroke-linecap="round" opacity=".72"/><path d="M228 395 C250 430,265 472,273 528" fill="none" stroke="#e34845" stroke-width="26" stroke-linecap="round" opacity=".35"/><path d="M164 347 C140 356,133 372,125 394" fill="none" stroke="#e34845" stroke-width="20" stroke-linecap="round" opacity=".65"/><path d="M252 347 C276 356,283 372,291 394" fill="none" stroke="#e34845" stroke-width="20" stroke-linecap="round" opacity=".35"/><text x="54" y="660" class="sans t">• 특정 방향의 회전·신전에서 통증 증가</text><text x="54" y="696" class="sans t">• ROM 제한과 국소 압통·보호성 긴장</text><text x="54" y="732" class="sans t">• 팔꿈치 아래 방사·객관적 결손 없음</text><rect x="419" y="152" rx="22" width="458" height="610" fill="#fff" stroke="#b8d5e2" stroke-width="2"/><rect x="419" y="152" rx="22" width="458" height="64" fill="#0a7a78"/><text x="443" y="194" class="sans ph">2  경추 신경성 통증 / radiculopathy</text><text x="443" y="246" class="sans h">목에서 팔로 이어지는 증상을 분리</text><circle cx="585" cy="335" r="62" fill="#f0c7b0" stroke="#ad7f6d" stroke-width="2"/><path d="M547 391 C520 430,510 520,520 616 L706 616 C713 525,695 435,655 394 Z" fill="#e9c2ad" stroke="#ad7f6d" stroke-width="2"/><path d="M649 440 C730 456,770 500,819 559" fill="none" stroke="#dcb39e" stroke-width="52" stroke-linecap="round"/><path d="M637 410 C650 432,665 447,684 459" fill="none" stroke="#e34343" stroke-width="24" stroke-linecap="round" opacity=".8"/><path d="M681 458 C728 475,755 509,803 568" fill="none" stroke="#e34343" stroke-width="18" stroke-linecap="round" opacity=".68"/><circle cx="805" cy="571" r="16" fill="#e34343"/><line x1="536" y1="422" x2="491" y2="456" stroke="#2c7fb8" stroke-width="6"/><text x="448" y="461" class="sans small">C5</text><line x1="540" y1="444" x2="490" y2="492" stroke="#32a357" stroke-width="6"/><text x="448" y="497" class="sans small">C6</text><line x1="544" y1="468" x2="490" y2="528" stroke="#e0a500" stroke-width="6"/><text x="448" y="533" class="sans small">C7</text><line x1="548" y1="492" x2="490" y2="565" stroke="#d34f73" stroke-width="6"/><text x="448" y="570" class="sans small">C8</text><rect x="452" y="627" width="392" height="104" rx="15" fill="#eef7f7"/><text x="470" y="657" class="sans t">Radicular pain: 팔로 뻗는 통증·전기감</text><text x="470" y="692" class="sans t">Radiculopathy: 감각·근력·반사 이상이 동반</text><text x="470" y="721" class="sans small">둘은 같은 뜻이 아니며 하나의 dermatome만으로 확정하지 않습니다.</text><rect x="905" y="152" rx="22" width="267" height="610" fill="#fff" stroke="#e3b7b7" stroke-width="2"/><rect x="905" y="152" rx="22" width="267" height="64" fill="#c73a3a"/><text x="929" y="194" class="sans ph">3  먼저 의뢰할 단서</text><text x="929" y="250" class="sans h" fill="#8e2020">진행성 신경학적 변화</text><text x="929" y="290" class="sans t">• 새로 커지는 근력저하</text><text x="929" y="325" class="sans t">• 손의 서투름·보행 이상</text><text x="929" y="360" class="sans t">• 양측성 증상</text><line x1="929" y1="385" x2="1146" y2="385" stroke="#e5c8c8"/><text x="929" y="425" class="sans h" fill="#8e2020">중증 원인 단서</text><text x="929" y="465" class="sans t">• 심한 외상</text><text x="929" y="500" class="sans t">• 발열·전신 증상</text><text x="929" y="535" class="sans t">• 암 병력 + 체중 감소</text><text x="929" y="570" class="sans t">• 설명되지 않는 야간 악화</text><rect x="927" y="608" width="223" height="114" rx="16" fill="#fff0ef" stroke="#f0b6b2"/><text x="944" y="640" class="sans t" fill="#962c2c">새 팔 저림이 생기면</text><text x="944" y="675" class="sans t" fill="#962c2c">기존 local-neck-pain</text><text x="944" y="710" class="sans t" fill="#962c2c">RCT 적용 범위를 재검토</text><rect x="28" y="788" width="1144" height="78" rx="18" fill="#123f64"/><text x="54" y="824" class="sans h" fill="#fff">핵심</text><text x="132" y="824" class="sans t" fill="#fff">같은 “목 통증”이라도 새 방사통·저림·객관적 결손이 생기면 진단 가설과 치료 계획을 다시 세웁니다.</text><text x="132" y="852" class="sans small" fill="#dbeafa">통증지도는 진단 확정 도구가 아니라 다음 문진과 진찰 순서를 정하기 위한 시각적 지도입니다.</text></svg>
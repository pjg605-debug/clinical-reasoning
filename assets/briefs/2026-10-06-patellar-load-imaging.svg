<svg xmlns="http://www.w3.org/2000/svg" width="800" height="767" viewBox="0 0 800 767" role="img" aria-label="영상 해석 · 먼저 묻는 4가지"><rect width="800" height="100%" fill="#fff"/><g fill="#244451" font-family="Noto Sans KR,Arial,sans-serif"><text x="28" y="57" font-size="32" font-weight="700">영상 해석 · 먼저 묻는 4가지</text><text x="28" y="89" font-size="20">교육용 판단 흐름 · 단일 소견으로 확진하지 않음</text><rect x="28" y="116" width="744" height="119" rx="16" fill="#eaf2f6"/><text x="50" y="155" font-size="27" font-weight="700">방향이 맞는가</text><text x="50" y="194" font-size="23">장축·단축을 함께 확인 · anisotropy 재검</text><rect x="28" y="265" width="744" height="119" rx="16" fill="#eef5ec"/><text x="50" y="304" font-size="27" font-weight="700">무엇을 비교하는가</text><text x="50" y="343" font-size="23">건 연속성 · 주변 구조 · 증상 위치</text><rect x="28" y="414" width="744" height="119" rx="16" fill="#fcf0e9"/><text x="50" y="453" font-size="27" font-weight="700">영상과 증상이 일치하는가</text><text x="50" y="492" font-size="23">신호 하나로 통증원을 확정하지 않음</text><rect x="28" y="563" width="744" height="119" rx="16" fill="#eaf2f6"/><text x="50" y="602" font-size="27" font-weight="700">결과가 관리를 바꾸는가</text><text x="50" y="641" font-size="23">부하 조정 · 추가 영상 · 의뢰를 결정</text><text x="28" y="737" font-size="20">다음 방문: 같은 조건의 기능과 안전 소견을 함께 확인</text></g></svg>
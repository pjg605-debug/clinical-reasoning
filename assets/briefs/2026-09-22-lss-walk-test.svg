<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc">
<title id="title">요추관협착증 의심 환자의 진료실 보행 재평가</title><desc id="desc">기준 증상 기록, 일정한 조건의 보행, 증상 발생 거리와 시간 기록, 자세별 회복 비교, 보행 후 신경학적 재검사를 단계별로 보여준다.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8fbfc"/><stop offset="1" stop-color="#edf3f5"/></linearGradient>
  <filter id="sh"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#263c46" flood-opacity=".12"/></filter>
  <style>text{font-family:Pretendard,'Noto Sans KR','Apple SD Gothic Neo',Arial,sans-serif;fill:#18323e}.h{font-weight:800}.muted{fill:#61727a}.small{font-size:17px}.tiny{font-size:14px}.white{fill:#fff}</style>
</defs>
<rect width="1200" height="850" rx="28" fill="url(#bg)"/>
<text x="54" y="70" font-size="40" class="h">“얼마나 아픈가” 대신 “언제, 몇 m에서 시작되는가”를 잽니다</text>
<text x="54" y="108" font-size="22" class="muted">진단 단독검사가 아니라, <tspan class="h">같은 조건에서 반복 가능한 기능 지표</tspan>를 만드는 과정입니다.</text>

<!-- timeline -->
<line x1="110" y1="244" x2="1090" y2="244" stroke="#b9cbd2" stroke-width="8" stroke-linecap="round"/>

<!-- step 1 -->
<g transform="translate(52 150)">
  <rect width="250" height="570" rx="24" fill="#fff" filter="url(#sh)"/>
  <circle cx="125" cy="94" r="44" fill="#315f74"/><text x="125" y="108" text-anchor="middle" font-size="36" class="h white">1</text>
  <text x="24" y="174" font-size="22" class="h">기준 증상 분리</text>
  <text x="24" y="208" class="small">• 허리 통증 NRS</text>
  <text x="24" y="238" class="small">• 다리 통증/저림 NRS</text>
  <text x="24" y="268" class="small">• 시작 전 감각·근력·반사</text>
  <g transform="translate(24 312)"><rect width="202" height="150" rx="18" fill="#e9f1f4"/>
    <path d="M96 24 q20 0 20 20 q0 18-20 18 q-20 0-20-18 q0-20 20-20z" fill="#a8bdc5"/>
    <path d="M74 70 q22-14 44 0 l12 56 h-68z" fill="#c7d6dc"/>
    <path d="M81 126 l-10 20 M119 126 l10 20" stroke="#7e99a4" stroke-width="10" stroke-linecap="round"/>
    <circle cx="82" cy="130" r="8" fill="#3f7ea1"/><circle cx="117" cy="130" r="8" fill="#3f7ea1"/>
  </g>
  <text x="24" y="498" class="tiny muted">한 숫자로 합치지 말고</text><text x="24" y="522" class="tiny h">허리와 다리 증상을 따로 기록</text>
</g>

<!-- step 2 -->
<g transform="translate(324 150)">
  <rect width="250" height="570" rx="24" fill="#fff" filter="url(#sh)"/>
  <circle cx="125" cy="94" r="44" fill="#567b67"/><text x="125" y="108" text-anchor="middle" font-size="36" class="h white">2</text>
  <text x="24" y="174" font-size="22" class="h">같은 조건으로 걷기</text>
  <text x="24" y="208" class="small">• 같은 복도·신발</text>
  <text x="24" y="238" class="small">• 평소 속도 지시</text>
  <text x="24" y="268" class="small">• 안전 범위에서 반복</text>
  <g transform="translate(24 312)"><rect width="202" height="150" rx="18" fill="#edf3ee"/>
    <circle cx="88" cy="28" r="18" fill="#9db4a3"/>
    <path d="M76 50 l22 3 l13 38 l-17 14 l-12 39" fill="none" stroke="#7f9b88" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M91 80 l-30 22" stroke="#7f9b88" stroke-width="10" stroke-linecap="round"/>
    <path d="M106 90 l33 16" stroke="#7f9b88" stroke-width="10" stroke-linecap="round"/>
    <path d="M94 105 l40 32" stroke="#7f9b88" stroke-width="12" stroke-linecap="round"/>
    <line x1="20" y1="140" x2="182" y2="140" stroke="#b5c6ba" stroke-width="4"/>
  </g>
  <text x="24" y="498" class="tiny muted">목표는 “진단 확정”이 아니라</text><text x="24" y="522" class="tiny h">다음 방문과 비교할 기준 만들기</text>
</g>

<!-- step 3 -->
<g transform="translate(596 150)">
  <rect width="250" height="570" rx="24" fill="#fff" filter="url(#sh)"/>
  <circle cx="125" cy="94" r="44" fill="#a06b3b"/><text x="125" y="108" text-anchor="middle" font-size="36" class="h white">3</text>
  <text x="24" y="174" font-size="22" class="h">발생·회복을 숫자로</text>
  <text x="24" y="208" class="small">• 첫 증상 시간</text>
  <text x="24" y="238" class="small">• 첫 증상 거리</text>
  <text x="24" y="268" class="small">• 중단 이유와 최고 강도</text>
  <g transform="translate(24 312)"><rect width="202" height="150" rx="18" fill="#f7efe6"/>
    <circle cx="58" cy="70" r="34" fill="#fff" stroke="#c59769" stroke-width="6"/>
    <line x1="58" y1="70" x2="58" y2="47" stroke="#9a6737" stroke-width="5" stroke-linecap="round"/><line x1="58" y1="70" x2="76" y2="82" stroke="#9a6737" stroke-width="5" stroke-linecap="round"/>
    <path d="M116 108 q24-52 48 0" fill="none" stroke="#9a6737" stroke-width="8"/><circle cx="116" cy="108" r="6" fill="#9a6737"/><circle cx="164" cy="108" r="6" fill="#9a6737"/>
    <text x="140" y="48" text-anchor="middle" class="tiny h">시간 + 거리</text>
  </g>
  <text x="24" y="498" class="tiny muted">치료 후 NRS가 좋아져도</text><text x="24" y="522" class="tiny h">거리·시간이 그대로면 별도 문제</text>
</g>

<!-- step 4 -->
<g transform="translate(868 150)">
  <rect width="280" height="570" rx="24" fill="#fff" filter="url(#sh)"/>
  <circle cx="140" cy="94" r="44" fill="#735f86"/><text x="140" y="108" text-anchor="middle" font-size="36" class="h white">4</text>
  <text x="24" y="174" font-size="22" class="h">회복 패턴 + 재검사</text>
  <text x="24" y="208" class="small">• 서서 쉬기 vs 앉기/굴곡</text>
  <text x="24" y="238" class="small">• 회복까지 걸린 시간</text>
  <text x="24" y="268" class="small">• 보행 후 신경학적 변화</text>
  <g transform="translate(24 312)"><rect width="232" height="150" rx="18" fill="#f0edf4"/>
    <circle cx="70" cy="34" r="16" fill="#a99bb5"/><path d="M70 52 q-22 28-12 62 l36 0 q10-36-8-60" fill="#cfc5d6"/>
    <path d="M58 80 l-24 20 M90 79 l27 18" stroke="#9a87aa" stroke-width="9" stroke-linecap="round"/>
    <path d="M63 112 l-8 25 M88 112 l10 25" stroke="#9a87aa" stroke-width="10" stroke-linecap="round"/>
    <path d="M124 95 q26 18 58 2" fill="none" stroke="#735f86" stroke-width="5" stroke-dasharray="7 6"/>
    <text x="158" y="72" class="tiny h">앉기/굴곡 후</text><text x="158" y="92" class="tiny h">회복 속도</text>
  </g>
  <text x="24" y="498" class="tiny muted">필요하면 보행 직후</text><text x="24" y="522" class="tiny h">감각·근력·반사를 다시 비교</text>
</g>

<!-- footer -->
<g transform="translate(52 748)"><rect width="1096" height="62" rx="16" fill="#fff" stroke="#c9d8dd"/>
<text x="20" y="25" class="tiny h">실전 기록 한 줄:</text><text x="128" y="25" class="tiny">“평지 보행 4분 20초/310 m에서 양측 종아리 무거움 NRS 6 시작 → 앉아 72초 후 NRS 1.”</text>
<text x="20" y="49" class="tiny muted">같은 조건을 다음 방문에 반복하면 치료가 통증만 줄였는지, 실제 보행 기능까지 바꿨는지 확인할 수 있습니다.</text></g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="767" viewBox="0 0 800 767" role="img" aria-label="저항운동에서 점프 복귀로"><rect width="800" height="100%" fill="#fff"/><g fill="#244451" font-family="Noto Sans KR,Arial,sans-serif"><text x="28" y="57" font-size="32" font-weight="700">저항운동에서 점프 복귀로</text><text x="28" y="89" font-size="20">교육용 판단 흐름 · 단일 소견으로 확진하지 않음</text><rect x="28" y="116" width="744" height="119" rx="16" fill="#eaf2f6"/><text x="50" y="155" font-size="27" font-weight="700">1 허용되는 저항운동</text><text x="50" y="194" font-size="23">경기 충격량과 운동 용량을 따로 기록</text><rect x="28" y="265" width="744" height="119" rx="16" fill="#eef5ec"/><text x="50" y="304" font-size="27" font-weight="700">2 점진적 저항 증가</text><text x="50" y="343" font-size="23">그날과 다음 아침 반응 확인</text><rect x="28" y="414" width="744" height="119" rx="16" fill="#fcf0e9"/><text x="50" y="453" font-size="27" font-weight="700">3 낮은 충격과 반복 착지</text><text x="50" y="492" font-size="23">급성 손상·심한 통증이면 수행하지 않음</text><rect x="28" y="563" width="744" height="119" rx="16" fill="#eaf2f6"/><text x="50" y="602" font-size="27" font-weight="700">4 스포츠 과제 복귀</text><text x="50" y="641" font-size="23">반복 수행 · 자신감 · 다음 날 반응</text><text x="28" y="737" font-size="20">다음 방문: 같은 조건의 기능과 안전 소견을 함께 확인</text></g></svg>
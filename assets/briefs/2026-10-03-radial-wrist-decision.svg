<svg xmlns="http://www.w3.org/2000/svg" width="800" height="767" viewBox="0 0 800 767" role="img" aria-label="요측 손목 통증 · 유지/변경"><rect width="800" height="100%" fill="#fff"/><g fill="#244451" font-family="Noto Sans KR,Arial,sans-serif"><text x="28" y="57" font-size="32" font-weight="700">요측 손목 통증 · 유지/변경</text><text x="28" y="89" font-size="20">교육용 판단 흐름 · 단일 소견으로 확진하지 않음</text><rect x="28" y="116" width="744" height="119" rx="16" fill="#eaf2f6"/><text x="50" y="155" font-size="27" font-weight="700">드퀘르벵 ↑, 유지</text><text x="50" y="194" font-size="23">들기 방식·엄지건 부하와 보조기 필요성 검토</text><rect x="28" y="265" width="744" height="119" rx="16" fill="#eef5ec"/><text x="50" y="304" font-size="27" font-weight="700">표재 요골신경 ↑</text><text x="50" y="343" font-size="23">압박 노출 조정·감각 경과, 진행하면 협진</text><rect x="28" y="414" width="744" height="119" rx="16" fill="#fcf0e9"/><text x="50" y="453" font-size="27" font-weight="700">CMC 관절 가중치 ↑</text><text x="50" y="492" font-size="23">관절 기능 평가, 관리 바뀌면 X-ray/협진</text><rect x="28" y="563" width="744" height="119" rx="16" fill="#eaf2f6"/><text x="50" y="602" font-size="27" font-weight="700">영상 단독 설명력 ↓</text><text x="50" y="641" font-size="23">관찰 각도/anisotropy·다른 구조를 재검토</text><text x="28" y="737" font-size="20">다음 방문: 같은 조건의 기능과 안전 소견을 함께 확인</text></g></svg>